<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <!-- Background Dark Rounded Square (Optional, great for app icons) -->
  <rect width="100" height="100" rx="22" fill="#1B3C53" />

  <!-- The Abstract Flight Yoke / Harness Structure -->
  <!-- A smooth, continuous path forming the steering control and harness bridge -->
  <path d="M 30,35
           C 22,35 22,55 32,55
           C 42,55 42,68 50,68
           C 58,68 58,55 68,55
           C 78,55 78,35 70,35"
        fill="none"
        stroke="#456882"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Central Control Node (The Harness System) -->
  <circle cx="50" cy="46" r="3.5" fill="#D2C1B6"  />
</svg>
